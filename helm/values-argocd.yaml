# Resource request/limit overrides for the official argo/argo-cd chart.
#
# WHY this whole file exists: this cluster's Azure Policy (Gatekeeper)
# enforces resource requests on EVERY container, including init/sidecar
# containers -- the upstream chart ships every one of these as `{}` (empty)
# by default, which is what caused the raw-manifest install to fail earlier
# with "container <copyutil> has no resource requests". These are
# deliberately small values (a few dozen millicores / tens of MB) since
# this is a learning POC, not a sizing exercise for real production load.
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

dex:
  initImage:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 50m, memory: 64Mi }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

redis:
  exporter:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 50m, memory: 64Mi }
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

redisSecretInit:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 50m, memory: 64Mi }

server:
  extensions:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 50m, memory: 128Mi }
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 200m, memory: 256Mi }

repoServer:
  copyutil:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 128Mi }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

applicationSet:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

notifications:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }

commitServer:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }