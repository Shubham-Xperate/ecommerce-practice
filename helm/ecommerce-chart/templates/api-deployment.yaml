# Templated equivalent of k8s/base/api-deployment.yaml -- see that file's
# comments for the full explanation of readiness vs liveness, why
# requests/limits matter for HPA, and the runAsNonRoot/runAsUser reasoning.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ecommerce-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.api.hpa.enabled }}
  # replicas is deliberately OMITTED when the HPA is enabled: the HPA
  # controller becomes the field-owner of .spec.replicas via the Deployment's
  # /scale subresource, and a Helm upgrade that also tries to set this field
  # every time conflicts with that ownership under Server-Side Apply
  # (confirmed live: "conflict with kube-controller-manager ... .spec.replicas").
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  # Dedicated selector label (NOT app.kubernetes.io/name, which
  # "ecommerce-chart.labels" already sets to the CHART name for Helm's own
  # tracking purposes) -- keeping pod-selection on its own key avoids the
  # duplicate-key collision that broke this exact field the first time
  # this chart was installed (selector required "ecommerce-api" but the
  # pod template ended up with "ecommerce-chart" instead).
  selector:
    matchLabels:
      ecommerce.io/component: api
  template:
    metadata:
      labels:
        ecommerce.io/component: api
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ecommerce-config
          env:
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: ecommerce-api-secret
                  key: jwt-key
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: ecommerce-api-secret
                  key: connection-string
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.keyVault.secretProviderClassName }}