# Templated equivalent of k8s/base/secretproviderclass.yaml -- see that
# file's comments for the full explanation of the CSI driver / Workload
# Identity / secretObjects sync mechanics. Nothing here duplicates that
# reasoning; only the values are parameterized.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.keyVault.secretProviderClassName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ecommerce-chart.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: sa-password
          objectType: secret
        - |
          objectName: jwt-key
          objectType: secret
        - |
          objectName: connection-string
          objectType: secret
  secretObjects:
    - secretName: ecommerce-db-secret
      type: Opaque
      data:
        - objectName: sa-password
          key: sa-password
    - secretName: ecommerce-api-secret
      type: Opaque
      data:
        - objectName: jwt-key
          key: jwt-key
        - objectName: connection-string
          key: connection-string