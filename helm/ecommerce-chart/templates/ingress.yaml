{{- if .Values.ingress.enabled -}}
# Routes "/" to ecommerce-web only, same as k8s/base/ingress.yaml -- the web
# pod's own nginx.conf handles proxying /api/ internally to ecommerce-api,
# so the Ingress only ever needs to know about one backend.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
  namespace: {{ .Values.namespace }}
  labels:
    app: ecommerce
    {{- include "ecommerce-chart.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ecommerce-web
                port:
                  number: 80
{{- end }}
