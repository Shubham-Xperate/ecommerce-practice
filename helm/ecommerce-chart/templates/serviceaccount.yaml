# Workload Identity ServiceAccount -- must exactly match the "subject"
# already federated on the id-ecommerce-api managed identity in Azure
# (system:serviceaccount:<namespace>:<name>), or the Azure AD token exchange
# silently fails. See k8s/base/serviceaccount.yaml for the original
# Kustomize version of this same object and its full explanation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ecommerce-chart.labels" . | nindent 4 }}
    azure.workload.identity/use: "true"
  annotations:
    azure.workload.identity/client-id: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
