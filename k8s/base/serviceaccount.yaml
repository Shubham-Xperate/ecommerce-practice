# =============================================================================
# serviceaccount.yaml -- ServiceAccount used for Azure Workload Identity
# =============================================================================
#
# WHY a dedicated ServiceAccount instead of the namespace's "default" one:
# only pods that explicitly set `serviceAccountName: ecommerce-workload-sa`
# get Key Vault access via Workload Identity. Any other pod in this namespace
# (using the implicit "default" ServiceAccount) is completely unaffected --
# keeping the blast radius to exactly what we intend.
#
# The name below ("ecommerce-workload-sa") must match EXACTLY the "subject"
# value baked into the federated credential on the id-ecommerce-api managed
# identity (system:serviceaccount:ecommerce:ecommerce-workload-sa) -- if
# these two ever drift apart, the Azure AD token exchange silently fails
# with no useful error inside Kubernetes itself.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecommerce-workload-sa
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-devops-lab
    # This exact label is what makes AKS's workload-identity mutating
    # webhook activate for pods using this ServiceAccount -- it's what
    # injects the projected, Azure-AD-exchangeable token into the pod at
    # creation time. Without this label, everything else can be perfectly
    # configured and nothing will still happen (a silent-failure trap).
    azure.workload.identity/use: "true"
  annotations:
    # The UAMI's CLIENT ID (not its object/principal ID) -- tells the
    # webhook which Azure AD application identity a pod using this
    # ServiceAccount should be able to request a token for.
    azure.workload.identity/client-id: "8a714c28-cf31-4d5d-8609-4e2b306271ed"