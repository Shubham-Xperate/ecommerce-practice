# =============================================================================
# secretproviderclass.yaml -- tells the Secrets Store CSI Driver's Azure
# plugin WHICH Key Vault, WHICH identity, and WHICH secrets to fetch, and
# how to mirror them into native Kubernetes Secrets the app already expects.
# =============================================================================
#
# IMPORTANT: creating this object does NOTHING by itself. The CSI driver
# only actually fetches anything once some pod mounts a `csi` volume that
# references this SecretProviderClass by name (wired up in api-deployment.yaml
# / sql-statefulset.yaml as the next step after this file).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ecommerce-kv-secrets
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-devops-lab
spec:
  # secrets-store.csi.x-k8s.io is provider-agnostic (Azure/AWS/GCP/Vault can
  # all plug in) -- this picks the Azure Key Vault plugin specifically.
  provider: azure
  parameters:
    # "false" = use Workload Identity Federation (the mechanism we just
    # wired up via the ServiceAccount's annotations/labels), NOT the older,
    # now-retired "AAD Pod Identity" project this flag is named after.
    usePodIdentity: "false"
    # Same UAMI Client ID as serviceaccount.yaml -- which identity the
    # plugin should request an Azure AD token as.
    clientID: "8a714c28-cf31-4d5d-8609-4e2b306271ed"
    keyvaultName: "kv-ecommercepoc-xp"
    tenantId: "9854c15e-4bcb-4a09-b064-3f56028c95c7"
    # NOTE: this value is a STRING containing embedded YAML (YAML-inside-YAML
    # -- a flexibility choice in this CRD's schema, not a typo). Each list
    # entry names one object to fetch from the vault, by its exact name.
    objects: |
      array:
        - |
          objectName: sa-password
          objectType: secret
        - |
          objectName: jwt-key
          objectType: secret
        - |
          objectName: connection-string
          objectType: secret
  # THIS is the part that actually creates real, native Kubernetes Secret
  # objects from the fetched values -- without it, values would only be
  # mounted as FILES inside the pod, never as a Secret. secretName/key below
  # match EXACTLY what api-deployment.yaml and sql-statefulset.yaml already
  # reference via secretKeyRef, so those files need zero changes.
  secretObjects:
    - secretName: ecommerce-db-secret
      type: Opaque
      data:
        - objectName: sa-password
          key: sa-password
    - secretName: ecommerce-api-secret
      type: Opaque
      data:
        - objectName: jwt-key
          key: jwt-key
        - objectName: connection-string
          key: connection-string